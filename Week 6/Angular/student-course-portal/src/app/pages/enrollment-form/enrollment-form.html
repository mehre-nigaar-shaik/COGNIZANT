<div class="form-container">
  <h2>Course Enrollment Request (Template-Driven)</h2>

  <div *ngIf="submitted" class="success-message">
    Enrollment request submitted successfully!
  </div>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" *ngIf="!submitted">
    <div class="form-group">
      <label for="studentName">Student Full Name *</label>
      <input type="text"
             id="studentName"
             name="studentName"
             [(ngModel)]="studentName"
             #nameCtrl="ngModel"
             required
             minlength="3"
             placeholder="Enter your full name">
      <div *ngIf="nameCtrl.touched && nameCtrl.errors" class="error-msg">
        <span *ngIf="nameCtrl.errors['required']">Name is required.</span>
        <span *ngIf="nameCtrl.errors['minlength']">Name must be at least 3 characters.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="studentEmail">Email Address *</label>
      <input type="email"
             id="studentEmail"
             name="studentEmail"
             [(ngModel)]="studentEmail"
             #emailCtrl="ngModel"
             required
             email
             placeholder="Enter your email">
      <div *ngIf="emailCtrl.touched && emailCtrl.errors" class="error-msg">
        <span *ngIf="emailCtrl.errors['required']">Email is required.</span>
        <span *ngIf="emailCtrl.errors['email']">Enter a valid email address.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID *</label>
      <input type="number"
             id="courseId"
             name="courseId"
             [(ngModel)]="courseId"
             #courseIdCtrl="ngModel"
             required
             placeholder="Enter numeric course ID">
      <div *ngIf="courseIdCtrl.touched && courseIdCtrl.errors" class="error-msg">
        <span *ngIf="courseIdCtrl.errors['required']">Course ID is required.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester"
              name="preferredSemester"
              [(ngModel)]="preferredSemester"
              #semCtrl="ngModel"
              required>
        <option value="Odd">Odd Semester</option>
        <option value="Even">Even Semester</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox"
             id="agreeToTerms"
             name="agreeToTerms"
             [(ngModel)]="agreeToTerms"
             #termsCtrl="ngModel"
             required>
      <label for="agreeToTerms">I agree to college enrollment terms and conditions *</label>
      <div *ngIf="termsCtrl.touched && termsCtrl.errors" class="error-msg">
        <span *ngIf="termsCtrl.errors['required']">You must agree to terms.</span>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-reset" (click)="enrollForm.resetForm()">Reset</button>
      <button type="submit" class="btn btn-submit" [disabled]="enrollForm.invalid">Submit</button>
    </div>
  </form>
</div>
